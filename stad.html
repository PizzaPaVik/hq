<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<title>Vencare City</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--ink:#eaf6ff;--ink2:rgba(214,236,255,.72);--ink3:rgba(190,220,245,.5);--hud:#5fe1ff;--pink:#ff7e8d;--gold:#ffd27a;--ok:#5be3a5;--line:rgba(140,210,255,.16);--glass:rgba(8,14,28,.72)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#04060c;color:var(--ink);font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:default}
button{font:inherit;cursor:pointer;color:inherit}
.hud{position:fixed;left:16px;right:16px;top:14px;display:flex;align-items:center;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.brand b{font-family:"Cascadia Mono",Consolas,monospace;letter-spacing:.32em;font-size:13px;color:var(--hud);font-weight:400}
.brand span{font-size:13px;color:var(--ink2)}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.warn i{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.chip.off i{background:#8aa;box-shadow:none}
button.chip{color:inherit}
#h-today b{font-weight:600}
.side ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55}
.side ol li{margin-bottom:6px}
.side code{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;background:rgba(95,225,255,.08);padding:1px 5px;border-radius:5px;word-break:break-all}
.chip .bar{width:60px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.chip .bar u{display:block;height:100%;background:var(--hud);text-decoration:none}
.chip.warn .bar u{background:var(--pink)}
.btn{height:36px;padding:0 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px}
.btn:hover{border-color:rgba(95,225,255,.45)}
.btn.p{background:var(--hud);color:#04121a;border:0}
.pend{background:rgba(255,126,141,.16);border-color:rgba(255,126,141,.5)}
.side{position:fixed;right:16px;top:64px;width:340px;max-width:calc(100vw - 32px);max-height:calc(100vh - 84px);overflow:auto;padding:16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);transform:translateX(120%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.side.on{transform:none}
.side h2{margin:0 0 2px;font-size:20px;font-weight:600}
.side .sub{font-size:13px;color:var(--ink3);margin-bottom:12px}
.side .row{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.side .row b{display:block;font-weight:500}
.side .row span{color:var(--ink3);font-size:12.5px}
.side .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none}
.side textarea{width:100%;min-height:64px;margin-top:10px;border-radius:10px;border:1px solid var(--line);background:rgba(4,8,16,.7);color:var(--ink);padding:10px;font:inherit;font-size:14px;resize:vertical}
.side .acts{display:flex;gap:8px;margin-top:8px}
.tip{position:fixed;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(4,8,16,.9);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .15s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.35s cubic-bezier(.32,.72,0,1);padding:10px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}
.party{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px) scale(.96);opacity:0;transition:.6s cubic-bezier(.32,.72,0,1);text-align:center;pointer-events:none;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.party.on{opacity:1;transform:translate(-50%,0) scale(1)}
.party small{display:block;font-family:"Cascadia Mono",Consolas,monospace;letter-spacing:.3em;color:var(--gold);font-size:13px;text-transform:uppercase}
.party b{display:block;font-size:44px;font-weight:700;letter-spacing:-.02em}
.party span{display:block;font-size:16px;color:var(--ink2);margin-top:4px}
.legend{position:fixed;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);padding:8px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend em::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.btn,.chip{white-space:nowrap;-webkit-tap-highlight-color:transparent}
.hud{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right))}
@media (max-width:700px){
  .chip.hide-s,.legend,#h-full{display:none}
  /* Mobil: rad 1 = namn, ljud och HQ. Rad 2 = beslut, dagens ordrar och live. */
  .hud{flex-wrap:wrap;gap:8px;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
  .brand{flex:1 1 calc(100% - 140px);min-width:0}
  .brand b{letter-spacing:.24em}
  .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #h-snd{order:1} #h-back{order:2}
  #h-pend,#h-today,#h-live{order:3;height:32px;font-size:12.5px;padding:0 10px}
  .btn,.chip{height:34px}
  .side{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;width:auto;max-width:none;max-height:62vh;transform:translateY(calc(100% + 24px))}
  .party{top:calc(96px + env(safe-area-inset-top));width:calc(100vw - 32px)}
  .party b{font-size:34px}
  .party span{font-size:15px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px);text-align:center}
}
@media (prefers-reduced-motion:reduce){.side,.toast,.party{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Vencare City: agenterna som figurer i en framtidsstad"></canvas>
<div class="hud">
  <div class="brand"><b>VENCARE CITY</b><span id="h-lead">Laddar staden…</span></div>
  <div class="chip hide-s" id="h-pro" title="Claude Pro"><span>Claude</span><span class="bar"><u id="h-pro-bar" style="width:0"></u></span><span id="h-pro-t">–</span></div>
  <button class="btn" id="h-pend" hidden></button>
  <div class="chip" id="h-today" hidden title="Ordrar i dag"></div>
  <button class="chip" id="h-live" hidden><i></i><span>Live</span></button>
  <div class="chip hide-s"><i></i><span id="h-time"></span></div>
  <button class="btn" id="h-snd" aria-label="Ljud av/på">🔈</button>
  <button class="btn" id="h-full">Helskärm</button>
  <button class="btn p" id="h-back">Jarvis</button>
</div>
<aside class="side" id="side" aria-live="polite"><button class="x" id="side-x" aria-label="Stäng">✕</button><div id="side-b"></div></aside>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="party" id="party"><small id="party-k"></small><b id="party-t"></b><span id="party-s"></span></div>
<div class="legend"><em style="--c:#5fe1ff">jobbar</em><em style="--c:#ff7e8d">väntar på dig</em><em style="--c:#5be3a5">klar</em><em style="--c:#8aa">ledig</em></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- Avdelningar och agenter ----------
const HUS = [
  { id: 'torn', namn: 'Jarvis-tornet', roll: 'Jarvis och Samordnaren. Här fattas besluten.', gx: 0, gy: 0, w: 2.2, d: 2.2, h: 250, c: '#5fe1ff', agenter: ['jarvis', 'samordnaren'] },
  { id: 'marknad', namn: 'Marknadshuset', roll: 'Strategi, annonser och resultat', gx: -5, gy: 3, w: 1.8, d: 1.6, h: 150, c: '#ff6b6b', agenter: ['marknadsforaren', 'annonser', 'annonsdashboard'] },
  { id: 'studio', namn: 'Studion', roll: 'Texter, UGC, video och bild', gx: -1.25, gy: -5.75, w: 1.7, d: 1.7, h: 120, c: '#ffb36b', agenter: ['innehall', 'ugc-fabriken', 'videobild'] },
  { id: 'butik', namn: 'Butiken', roll: 'Shopify, konvertering, kundservice och ekonomi', gx: 1.5, gy: 5.5, w: 2, d: 1.6, h: 110, c: '#f5d36b', agenter: ['butik', 'konvertering', 'kundservice', 'ekonomi'] },
  { id: 'post', namn: 'Postkontoret', roll: 'Mejl och Klaviyo', gx: 5.25, gy: -0.25, w: 1.5, d: 1.5, h: 95, c: '#b49cff', agenter: ['mejl'] },
  { id: 'labb', namn: 'Labbet', roll: 'Research och produkttester', gx: -5.75, gy: -1.25, w: 1.6, d: 1.4, h: 135, c: '#6fb6ff', agenter: ['research', 'produkttestaren'] },
  { id: 'kvalitet', namn: 'Kvalitetshuset', roll: 'Temat och granskning', gx: -2.75, gy: 5.75, w: 1.5, d: 1.7, h: 105, c: '#7be0a0', agenter: ['granskare', 'tema'] },
  { id: 'bibliotek', namn: 'Kunskapsbiblioteket', roll: 'Skills som agenterna kan slå upp', gx: 3, gy: -5, w: 1.7, d: 1.5, h: 85, c: '#e7d7ff', agenter: [] },
];
const NAMN = { jarvis: 'Jarvis', samordnaren: 'Samordnaren', marknadsforaren: 'Marknadsföraren', annonser: 'Annonser', annonsdashboard: 'Annonsdashboard', innehall: 'Innehåll', 'ugc-fabriken': 'UGC-fabriken', videobild: 'Video & bild', butik: 'Butik', konvertering: 'Konvertering', kundservice: 'Kundservice', ekonomi: 'Ekonomi', mejl: 'Mejl', research: 'Research', produkttestaren: 'Produkttestaren', granskare: 'Granskare', tema: 'Tema' };
const husFor = id => HUS.find(h => h.agenter.includes(id)) || HUS[0];
const PLATS = { gx: 2.2, gy: 2.2 }; // Beslutstorget framför tornet

// ---------- Isometri ----------
let W = 0, H = 0, DPR = 1, TW = 64, TH = 32, OX = 0, OY = 0, zoom = 1, tz = 1; // tz: textens skala, aldrig för liten för att läsas
const iso = (gx, gy) => ({ x: OX + (gx - gy) * TW / 2 * zoom, y: OY + (gx + gy) * TH / 2 * zoom });
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // På mobil räcker det att husen får plats – markplattans hörn får gå utanför kanten.
  const mobil = W < 700;
  zoom = Math.max(mobil ? .3 : .55, Math.min(1.35, mobil ? Math.min(W / 800, H / 880) : Math.min(W / 1180, H / 760)));
  OX = W / 2; OY = mobil ? H * .56 : H * .52; tz = Math.max(.82, zoom);
}
addEventListener('resize', resize); resize();

// ---------- Data ----------
let D = {}, laddad = false;
const P = () => Array.isArray(D.pending) ? D.pending : [];
const L = () => Array.isArray(D.log) ? D.log : [];
const ålder = t => { try { return Date.now() - new Date(t).getTime(); } catch { return 1e12; } };
function läge(id) {
  const l = L().filter(r => r.agent === id);
  if (l.some(r => r.status === 'pågår')) return { s: 'jobbar', t: l.find(r => r.status === 'pågår').task };
  const p = P().find(x => x.agent === id); if (p) return { s: 'väntar', t: p.title };
  const k = l.find(r => r.status === 'klar' && ålder(r.tid) < 6 * 3600e3); if (k) return { s: 'klar', t: k.task };
  return { s: 'ledig', t: (l[0] && l[0].task) || '' };
}
// Två lägen: lokalt (Vencare Team på datorn, data från /data) och i HQ på nätet
// (samma inloggning som HQ, data från Supabase – fungerar även när datorn är avstängd).
const LOKAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let info = '';
const HQ = (() => {
  const läs = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
  const cfg = () => { const c = läs('hq.cfg.v1') || {}, C = window.HQ_CONFIG || {}; return { url: String(c.url || C.supabaseUrl || '').trim().replace(/\/+$/, ''), key: String(c.key || C.supabaseAnonKey || '').trim() }; };
  async function token() {
    const s = läs('hq.session.v1'); if (!s || !s.access_token) throw new Error('auth');
    if (Date.now() < s.expires_at - 60000) return s.access_token;
    const { url, key } = cfg();
    const r = await fetch(url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    if (!r.ok) throw new Error(r.status < 500 ? 'auth' : 'nät');
    const j = await r.json();
    try { localStorage.setItem('hq.session.v1', JSON.stringify({ ...s, access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 })); } catch {}
    return j.access_token;
  }
  async function rest(path, opts = {}) {
    const { url, key } = cfg(); if (!url || !key) throw new Error('cfg');
    const t = await token();
    const r = await fetch(`${url}/rest/v1/${path}`, { ...opts, cache: 'no-store', headers: { apikey: key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    if (r.status === 401) throw new Error('auth');
    const txt = await r.text();
    if (!r.ok) { const e = new Error(txt || 'HTTP ' + r.status); e.status = r.status; throw e; }
    return txt ? JSON.parse(txt) : null;
  }
  function användare() { try { const s = läs('hq.session.v1'), p = s.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(atob(p)).sub || ''; } catch { return ''; } }
  return { rest, cfg, användare };
})();
const felText = e => e.message === 'cfg' || e.message === 'auth' ? 'Logga in i HQ först – öppna HQ, logga in och kom tillbaka hit.' : (e instanceof TypeError || e.message === 'nät') ? 'Ingen kontakt med Supabase just nu. Försöker igen…' : 'Kunde inte hämta läget: ' + e.message.slice(0, 80);
async function hämta() {
  if (LOKAL) { try { const r = await fetch('/data', { cache: 'no-store' }); if (r.ok) { D = await r.json(); laddad = true; uppdatera(); } } catch {} return; }
  try {
    const rad = (await HQ.rest('items?kind=eq.jarvis&deleted=is.false&select=data&limit=1'))[0];
    const s = rad && rad.data;
    // Utan hela historiken (hist) firas inga milstolpar – summan sedan start skulle bli fel.
    if (s) D = { ...s, history: { days: Array.isArray(s.hist) ? s.hist : [] } };
    laddad = true; info = s ? '' : 'Jarvis på datorn har inte skickat något till HQ än.'; uppdatera();
  } catch (e) { info = felText(e); }
}

// ---------- Live-ordrar (Shopify → Supabase, utan datorn) ----------
let LIVE = [], liveOk = null;
const dagNyckel = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
async function hämtaOrdrar() {
  if (LOKAL) return;
  try {
    const rader = await HQ.rest('live_orders?select=id,total,currency,items,test,created_at&order=created_at.desc&limit=100') || [];
    liveOk = true; LIVE = rader;
    const sedda = store.get('stad-sedda', null), nya = sedda ? rader.filter(o => !sedda.includes(o.id)) : [];
    store.set('stad-sedda', rader.map(o => o.id));
    nya.reverse().forEach((o, i) => setTimeout(() => nyOrder(o), i * 7000));
    if (nya.some(o => !o.test)) setTimeout(() => milstolpar(), nya.length * 7000);
  } catch (e) { if (e.status === 404 || /live_orders/.test(e.message)) liveOk = false; }
  rita();
  function rita() {
    const l = $('#h-live'); l.hidden = liveOk === null; l.classList.toggle('off', !liveOk);
    l.querySelector('span').textContent = liveOk ? 'Live' : 'Live av'; l.title = liveOk ? 'Nya ordrar firas inom 10 sekunder' : 'Live-ordrar är inte kopplade än – klicka för hur';
    const idag = dagNyckel(Date.now()), d = LIVE.filter(o => !o.test && dagNyckel(o.created_at) === idag), t = $('#h-today');
    t.hidden = !liveOk; t.innerHTML = `I dag <b>${d.length}</b> ${d.length === 1 ? 'order' : 'ordrar'} · <b>${fmt(d.reduce((a, o) => a + (+o.total || 0), 0))} kr</b>`;
  }
}
function nyOrder(o) {
  const tid = new Date(o.created_at).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  fira(o.test ? 'Testorder' : 'Ny order', fmt(+o.total || 0) + ' kr', (o.items ? `${o.items} ${o.items === 1 ? 'produkt' : 'produkter'} · ` : '') + 'kl ' + tid, (+o.total || 0) >= 1000 ? 2 : 1);
}
function visaLive() {
  const url = HQ.cfg().url;
  if (liveOk) return öppna(`<h2>Live-ordrar</h2><div class="sub">Kopplat. Shopify skickar varje ny order direkt hit, även när datorn är avstängd.</div>` + LIVE.slice(0, 8).map(o => `<div class="row"><b>${fmt(+o.total || 0)} kr${o.test ? ' · test' : ''}</b><span>${esc(new Date(o.created_at).toLocaleString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}${o.items ? ' · ' + o.items + ' st' : ''}</span></div>`).join('') + (LIVE.length ? '' : '<div class="row"><span>Inga ordrar än. Nästa order firas här.</span></div>'));
  öppna(`<h2>Koppla live-ordrar</h2><div class="sub">En gång, ca 10 minuter. Sedan firar staden varje order direkt – även när datorn är avstängd.</div>
    <ol><li><b>Supabase → SQL Editor:</b> kör <code>stad.sql</code>. Längst ner visas en nyckel (token).</li>
    <li><b>Supabase → Edge Functions → Deploy a new function → Via Editor:</b> namn <code>shopify-order</code>, klistra in <code>.team/supabase/functions/shopify-order/index.ts</code>, tryck Deploy och stäng av <b>Verify JWT</b>.</li>
    <li><b>Shopify:</b> en webhook för <i>orders/create</i> till <code>${esc(url ? url + '/functions/v1/shopify-order?k=NYCKELN' : 'https://DITT-PROJEKT.supabase.co/functions/v1/shopify-order?k=NYCKELN')}</code>. Jarvis kan skapa den åt dig.</li></ol>
    <div class="sub" style="margin-top:10px">Steg för steg finns i LÄS-MIG.md under "Vencare City på nätet".</div>`);
}

// ---------- Figurer ----------
const FIG = [];
Object.keys(NAMN).forEach((id, i) => {
  const h = husFor(id), a = (i * 2.399) % (Math.PI * 2);
  const hem = { gx: h.gx + Math.cos(a) * (h.w / 2 + .7), gy: h.gy + Math.sin(a) * (h.d / 2 + .7) };
  FIG.push({ id, h, hem, gx: hem.gx, gy: hem.gy, tx: hem.gx, ty: hem.gy, fas: Math.random() * 6, vänta: Math.random() * 4, c: h.c, läge: { s: 'ledig', t: '' } });
});
function mål(f) {
  const s = f.läge.s;
  if (s === 'väntar') return { gx: PLATS.gx + (Math.random() - .5) * 2.4, gy: PLATS.gy + (Math.random() - .5) * 1.2 };
  if (s === 'jobbar') return { gx: f.h.gx + (Math.random() - .5) * .5, gy: f.h.gy + f.h.d / 2 + .45 };
  if (s === 'ledig' && Math.random() < .25) { const b = HUS.find(x => x.id === 'bibliotek'); return { gx: b.gx - .2 + Math.random() * .4, gy: b.gy + b.d / 2 + .5 }; }
  if (s === 'ledig' && Math.random() < .3) return { gx: PLATS.gx + (Math.random() - .5) * 3, gy: PLATS.gy + 1 + Math.random() };
  return { gx: f.hem.gx + (Math.random() - .5) * .8, gy: f.hem.gy + (Math.random() - .5) * .8 };
}
function uppdatera() {
  FIG.forEach(f => { const n = läge(f.id); if (n.s !== f.läge.s) { f.läge = n; const m = mål(f); f.tx = m.gx; f.ty = m.gy; } else f.läge = n; });
  const p = P().length; const pe = $('#h-pend'); pe.hidden = !p; pe.textContent = p + (p === 1 ? ' beslut väntar' : ' beslut väntar'); pe.classList.toggle('pend', !!p);
  const run = FIG.filter(f => f.läge.s === 'jobbar').length;

$('#side-x').onclick = stäng; addEventListener('keydown', e => { if (e.key === 'Escape') stäng(); });
const ge = (id, ph) => `<textarea id="s-q" placeholder="${esc(ph)}"></textarea><div class="acts"><button class="btn p" data-ge="${esc(id)}">Ge uppdrag</button></div>`;
function visaAgent(id) {
  const f = FIG.find(x => x.id === id), l = L().filter(r => r.agent === id).slice(0, 5), p = P().filter(x => x.agent === id), hit = (D.hit || {})[id];
  öppna(`<h2>${esc(NAMN[id])}</h2><div class="sub">${esc(f.h.namn)} · ${esc(f.läge.s)}${hit && hit.ja + hit.nej ? ` · ${Math.round(hit.ja / (hit.ja + hit.nej) * 100)} % av förslagen godkända` : ''}</div>`
    + p.map(x => `<div class="row"><b>Väntar på dig: ${esc(x.title)}</b><span>${esc(x.detail || '')}</span></div>`).join('')
    + (l.length ? l.map(r => `<div class="row"><b>${esc(r.task)}</b><span>${esc(r.status)}${r.result ? ' · ' + esc(r.result) : ''}</span></div>`).join('') : '<div class="row"><span>Inga uppdrag i loggen än.</span></div>')
    + ge(id, `Vad ska ${NAMN[id]} göra?`));
}
function visaHus(h) {
  öppna(`<h2>${esc(h.namn)}</h2><div class="sub">${esc(h.roll)}</div>`
    + (h.id === 'bibliotek' ? (D.skills || []).map(s => `<div class="row"><b>${esc(s.name)}</b><span>${esc((s.description || '').slice(0, 120))}</span></div>`).join('') + `<div class="acts"><button class="btn" data-skill>Leta efter nya skills</button></div>`
      : h.agenter.map(id => { const f = FIG.find(x => x.id === id); return `<div class="row" data-agent="${id}" style="cursor:pointer"><b>${esc(NAMN[id])}</b><span>${esc(f.läge.s)}${f.läge.t ? ' · ' + esc(f.läge.t) : ''}</span></div>`; }).join('')));
}
function visaBeslut() {
  const p = P();
  öppna(`<h2>Beslutstorget</h2><div class="sub">${p.length ? p.length + ' väntar på dig' : 'Inget väntar på dig'}</div>` + p.map(x => `<div class="row"><b>${esc(x.title)}</b><span>${esc([x.effekt && 'Effekt: ' + x.effekt, x.insats && 'Insats: ' + x.insats, NAMN[x.agent]].filter(Boolean).join(' · '))}</span><div class="acts"><button class="btn p" data-ok="${esc(x.id)}">${esc(x.yes || 'Godkänn')}</button></div></div>`).join('') + `<div class="acts"><button class="btn" id="s-hela">Öppna besluten i Jarvis</button></div>`);
}
async function skicka(text) {
  if (!LOKAL) {
    // I HQ: lägg uppdraget i Supabase som HQ gör. Datorn kör det när den är igång.
    try { const n = Date.now(); await HQ.rest('items', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify([{ id: crypto.randomUUID(), kind: 'jarvis-order', data: { text, title: text.replace(/^jarvis:\s*/i, ''), status: 'ny', from: 'Staden', createdAt: n }, deleted: false, client_updated_at: n }]) }); visa('Skickat till Jarvis. Datorn kör det när den är igång – svaret syns i HQ.'); }
    catch (e) { visa(felText(e)); }
    return;
  }
  try { const r = await fetch('/oppna', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vencare': '1' }, body: JSON.stringify({ agent: '', text }) }); if (!r.ok) throw 0; visa('Claude öppnas med uppdraget. Tryck Enter där.'); }
  catch { visa('Jarvis-servern är stängd. Öppna Vencare Team igen.'); }
}
side.addEventListener('click', e => {
  const g = e.target.closest('[data-ge]'); if (g) { const t = ($('#s-q') || {}).value || ''; if (!t.trim()) return visa('Skriv vad som ska göras först.'); skicka(`Jarvis: låt ${NAMN[g.dataset.ge] || 'Jarvis'} (${g.dataset.ge}) ta det här: ${t.trim()}`); return; }
  const o = e.target.closest('[data-ok]'); if (o) { const x = P().find(p => p.id === o.dataset.ok); if (x) skicka(x.prompt || `Jarvis: godkänt: ${x.title} (${x.id})`); return; }
  const a = e.target.closest('[data-agent]'); if (a) return visaAgent(a.dataset.agent);
  if (e.target.closest('[data-skill]')) return skicka('Jarvis: kör skill-scouten nu: leta efter skills som skulle hjälpa Vencare och agenterna, säkerhetsgranska dem och föreslå de bästa. Installera inget.');
  if (e.target.id === 's-hela') location.href = LOKAL ? '/' : './';
});
let tt = 0; function visa(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 3500); }

// ---------- HUD ----------
$('#h-pend').onclick = visaBeslut;
$('#h-back').onclick = () => { location.href = LOKAL ? '/' : './'; };
if (!LOKAL) { $('#h-back').textContent = 'HQ'; $('#h-live').onclick = visaLive; }
// Håll skärmen vaken när staden visas, t.ex. på en skärm i skolan.
let vaken = null; const väck = async () => { try { if (!vaken && document.visibilityState === 'visible' && navigator.wakeLock) { vaken = await navigator.wakeLock.request('screen'); vaken.addEventListener('release', () => { vaken = null; }); } } catch {} };
addEventListener('pointerdown', väck); document.addEventListener('visibilitychange', väck);
// Helskärm finns inte på iPhone (och behövs inte när staden öppnas från hemskärmen).
if (!document.documentElement.requestFullscreen || matchMedia('(display-mode: standalone)').matches) $('#h-full').hidden = true;
$('#h-full').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); };
document.addEventListener('fullscreenchange', () => { $('#h-full').textContent = document.fullscreenElement ? 'Lämna helskärm' : 'Helskärm'; });
const klocka = () => { $('#h-time').textContent = nu().toLocaleString('sv-SE', { weekday: 'short', hour: '2-digit', minute: '2-digit' }); }; klocka(); setInterval(klocka, 15000);
const starta = () => { hämta(); setInterval(hämta, LOKAL ? 15000 : 30000); hämtaOrdrar(); setInterval(hämtaOrdrar, 10000); };
// I HQ ligger Supabase-uppgifterna i config.js (eller i HQ:s inställningar). Lokalt behövs den inte.
if (LOKAL) starta(); else { const s = document.createElement('script'); s.src = 'config.js'; s.onload = s.onerror = starta; document.head.appendChild(s); }
// Förhandsvisa en fest: /kontor?fira=1
if (/[?&]fira=1/.test(location.search)) setTimeout(() => fira('Förhandsvisning', 'Första ordern!', 'Så här firar staden en milstolpe.', 3), 1200);
})();
</script>
